<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Owlpo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f6f0e6; --ink:#1c1812; --soft:#4b4138; --wax:#8b3a2e; --rule:rgba(28,24,18,.16); }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Lora',Georgia,serif;line-height:1.55;}
    .wrap{max-width:480px;margin:0 auto;padding:64px 24px;}
    h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:2rem;margin:0 0 8px;}
    .sub{color:var(--soft);margin:0 0 24px;}
    label{display:block;font-size:14px;color:var(--soft);margin-bottom:6px;}
    input{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:#fffaf2;font-family:inherit;font-size:16px;color:var(--ink);}
    input:focus{outline:none;border-color:var(--ink);}
    .btn{display:block;width:100%;margin-top:16px;padding:12px;font-family:'Lora',serif;font-size:15px;border:none;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .msg{margin-top:14px;font-size:14px;}
    .msg.ok{color:#2c6d3a;}
    .msg.err{color:var(--wax);}
    a{color:var(--wax);}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Reset your password</h1>
    <p class="sub">Set a new password for your Owlpo account.</p>
    <form id="form">
      <label for="pw">New password (at least 8 characters)</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn" id="btn" type="submit">Set new password</button>
      <p class="msg" id="msg"></p>
    </form>
    <p style="margin-top:24px;"><a href="/">← Back to Owlpo</a></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const form = document.getElementById('form');
    const btn  = document.getElementById('btn');
    const pw   = document.getElementById('pw');
    const msg  = document.getElementById('msg');

    if (!token) {
      msg.textContent = 'Missing or invalid reset link.';
      msg.className = 'msg err';
      btn.disabled = true;
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      msg.textContent = ''; msg.className = 'msg';
      btn.disabled = true;
      try {
        const r = await fetch('/api/auth-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pw.value }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Could not reset password.');
        msg.textContent = 'Password updated. Redirecting to login…';
        msg.className = 'msg ok';
        setTimeout(() => window.location.href = '/', 1500);
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg err';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
